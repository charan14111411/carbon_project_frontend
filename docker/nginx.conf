# Cache-Control by file (this file is included in nginx's http block, so a map is allowed here). Set once at server level below,
# because an add_header inside a location would drop every server-level header (the CSP and the other security headers).
#  - Build output with a content hash in its name (main-AB12CD34.js, chunk-*.js, styles-*.css, media/*-HASH.*): cached for a year,
#    immutable; a new build gets new names.
#  - /api/: left to the backend (an empty value sends no header).
#  - Everything else, notably index.html (also served for every app route by try_files) and the unhashed vendor/ files: no-cache,
#    i.e. revalidated with the ETag on each use, so a deploy is picked up at once.
map $uri $cache_control {
  default "no-cache";
  ~^/api/ "";
  "~-[A-Z0-9]{8}\.(?:js|mjs|css|woff2?|ttf|eot|png|jpe?g|gif|webp|svg|ico)$" "public, max-age=31536000, immutable";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  # Above the backend's MAX_UPLOAD_BYTES (15 MB) plus multipart overhead, so the API (not nginx) reports a too-large file.
  client_max_body_size 25m;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/geo+json application/xml image/svg+xml;

  add_header Cache-Control $cache_control;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # Content-Security-Policy. Origins the app loads from:
  #  - its own files ('self'): index.html, JS chunks, styles, Leaflet images (media/), MapLibre worker + CSS (vendor/maplibre/), /api.
  #  - Google Fonts: the stylesheet (fonts.googleapis.com; the production build usually inlines it) and the font files (fonts.gstatic.com).
  #  - Map tiles. These are the backend's DEVELOPMENT defaults (app/core/config.py): MAP_TILE_URL (OpenStreetMap),
  #    MAP_TERRAIN_URL (AWS Terrain Tiles bucket) and MAP_SATELLITE_URL (Esri World Imagery). Leaflet loads tiles as <img>
  #    (img-src); MapLibre's worker fetches them (connect-src). When MAP_* point to a licensed / self-hosted source, replace these
  #    origins in BOTH img-src and connect-src, or the maps show shapes without a background.
  # Relaxations, and why:
  #  - script-src 'unsafe-hashes' + one sha256: the production build loads the global stylesheet with
  #    <link media="print" onload="this.media='all'"> (critical-CSS inlining). The hash allows exactly that handler and nothing
  #    else; without it the full stylesheet never applies. If the build changes the handler text, recompute the hash (or set
  #    optimization.styles.inlineCritical=false in angular.json and drop both tokens). No 'unsafe-inline' or 'unsafe-eval' for scripts.
  #  - style-src 'unsafe-inline': Angular injects component styles as <style> elements at runtime, the build inlines critical CSS
  #    and the font CSS, and Leaflet map pins carry a style attribute. Inline styles cannot run script.
  #  - img-src data: blob:: MapLibre's control icons are data: SVGs and it decodes tiles from blob: URLs.
  #  - worker-src blob:: MapLibre's fallback when its worker would come from another origin (here it is served from 'self').
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://s3.amazonaws.com/elevation-tiles-prod/ https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/; connect-src 'self' https://tile.openstreetmap.org https://s3.amazonaws.com/elevation-tiles-prod/ https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    # Report generation and 15 MB uploads (scanned before they are stored) can take a while; nothing legitimate needs more.
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
  }

  # MapLibre's module worker (vendor/maplibre/*.mjs) must be served as JavaScript: browsers refuse module scripts of another type.
  location ~* \.mjs$ {
    types { }
    default_type text/javascript;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
